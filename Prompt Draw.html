<style>
:root{

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#131D24;--sheet:#1B2932;--ink:#E8EDE9;--soft:#93A2AB;--line:#2E3F4A;--mark:#F3D84A;--mark-ink:#1B2932;--deep:#7CC4C8}
}
:root[data-theme="dark"]{--paper:#131D24;--sheet:#1B2932;--ink:#E8EDE9;--soft:#93A2AB;--line:#2E3F4A;--mark:#F3D84A;--mark-ink:#1B2932;--deep:#7CC4C8}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.wrap{max-width:620px;margin:0 auto}
h1{margin:0 0 12px;font-size:1.75rem;font-weight:800;letter-spacing:-.03em;line-height:1}
h1 span{background:linear-gradient(transparent 55%,var(--mark) 55%);padding:0 .12em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1 span{background:none;color:var(--mark);padding:0}}
:root[data-theme="dark"] h1 span{background:none;color:var(--mark);padding:0}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:9px 6px;font-weight:600;font-size:.95rem}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
main{padding:16px 18px 120px}
.hint{color:var(--soft);font-size:.9rem;margin:0 0 14px}
.set{background:var(--sheet);border:1px solid var(--line);border-radius:6px 18px 6px 18px;margin:0 0 16px;overflow:hidden}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px dashed var(--line);padding:11px 16px 12px}
.row small{display:block;color:var(--deep);font-size:.78rem;font-weight:600;margin-bottom:2px}
.row b{font-family:"Newsreader",Georgia,"Times New Roman",serif;font-weight:500;font-size:1.22rem;line-height:1.3;border-radius:3px}
.row.static{cursor:default}
.flash b{animation:flash .7s ease-out}
@keyframes flash{from{background:var(--mark);color:var(--mark-ink)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash b{animation:none}}
.acts{display:flex;gap:8px;padding:10px 12px}
.acts button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:.88rem;font-weight:600}
.acts button.on{background:var(--mark);border-color:var(--mark);color:var(--mark-ink)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--paper) 35%)}
.bar button{display:block;width:100%;max-width:620px;margin:0 auto;border:0;border-radius:999px;background:var(--mark);color:var(--mark-ink);font-weight:800;font-size:1.1rem;padding:15px;box-shadow:0 3px 0 var(--ink)}
.bar button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.empty{color:var(--soft);padding:30px 4px;font-size:1rem;line-height:1.5}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:.9rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
</style>
</head>

const NAMES={OCCUPATION:"Occupation",SETTING:"Setting",FEELING:"Feeling",CONFLICT:"Conflict",WILDCARD:"Wildcard",SMELLS:"Smell",SIGHTS:"Sight",TOUCH:"Touch",TASTE:"Taste",SOUNDS:"Sound"};
const SETS=5, KEY="promptdraw.saved";
let tab="writing", draws={writing:[],sensory:[]}, saved=[];
try{saved=JSON.parse(localStorage.getItem(KEY)||"[]")||[]}catch(e){saved=[]}
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const newSet=k=>Object.keys(DATA[k]).map(c=>[c,pick(DATA[k][c])]);
const draw=k=>{draws[k]=Array.from({length:SETS},()=>newSet(k))};
const sig=s=>s.map(r=>r.join("=")).join("|");
const text=s=>s.map(r=>NAMES[r[0]]+": "+r[1]).join("\n");
const view=document.getElementById("view"), toastEl=document.getElementById("toast");
let tt;function toast(m){toastEl.textContent=m;toastEl.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("show"),1400)}
async function copy(t){
  try{await navigator.clipboard.writeText(t);return toast("Copied")}catch(e){}
  try{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();toast(ok?"Copied":"Copy blocked. Press and hold the text instead.")}
  catch(e){toast("Copy blocked. Press and hold the text instead.")}
}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function card(set,live,i){
  const c=el("section","set");
  set.forEach((r,j)=>{
    const row=el(live?"button":"div","row"+(live?"":" static"));
    row.append(el("small","",NAMES[r[0]]),el("b","",r[1]));
    if(live){row.setAttribute("aria-label","Swap "+NAMES[r[0]]+": "+r[1]);row.onclick=()=>{
      const list=DATA[tab][r[0]];let v;do{v=pick(list)}while(v===r[1]&&list.length>1);
      r[1]=v;render();const n=view.children[i+1].children[j];n.classList.add("flash")}}
    c.append(row)});
  const acts=el("div","acts"), cp=el("button","","Copy"), isSaved=saved.some(s=>sig(s)===sig(set));
  cp.onclick=()=>copy(text(set));
  const sv=el("button",isSaved&&live?"on":"",live?(isSaved?"Saved":"Save"):"Remove");
  sv.onclick=()=>{const k=sig(set),at=saved.findIndex(s=>sig(s)===k);
    if(at>-1){saved.splice(at,1);toast("Removed")}else{saved.unshift(set.map(r=>r.slice()));toast("Saved")}
    store();render()};
  acts.append(cp,sv);c.append(acts);return c}
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  document.getElementById("bar").style.display=tab==="saved"?"none":"";
  view.textContent="";
  if(tab==="saved"){
    if(!saved.length){view.append(el("p","empty","Nothing saved yet. Tap Save under any set on the Story or Senses tab and it shows up here."));return}
    view.append(el("p","hint",saved.length+(saved.length===1?" saved set":" saved sets")));
    saved.forEach(s=>view.append(card(s,false)));return}
  view.append(el("p","hint","Tap any line to swap just that one."));
  draws[tab].forEach((s,i)=>view.append(card(s,true,i)))}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});
document.getElementById("shuffle").onclick=()=>{draw(tab);render();window.scrollTo({top:0,behavior:"smooth"})};
draw("writing");draw("sensory");render();
</script>
